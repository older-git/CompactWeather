# XcodeGen spec. Regenerate the project with: xcodegen generate
# Signing team and bundle ID prefix come from Config/Local.xcconfig (see Config/Base.xcconfig).
# The build number lives in Config/BuildNumber.xcconfig and is bumped by a scheme pre-action
# (Tools/bump-build-number.sh) on every build; watchOS ignores a re-installed complication
# extension whose build number didn't change.
name: CompactWeather
options:
  deploymentTarget:
    watchOS: "10.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
schemes:
  CompactWeather:
    build:
      targets:
        CompactWeather: all
      preActions:
        - name: Bump build number
          script: '"$SRCROOT/Tools/bump-build-number.sh"'
          settingsTarget: CompactWeather
    run:
      config: Debug
    archive:
      config: Release
targets:
  CompactWeather:
    type: application
    platform: watchOS
    sources: [App, Shared]
    dependencies:
      - target: CompactWeatherWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CmpctWthr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: Your location is used to show local weather (rounded to about 1 km and sent to open-meteo.com).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CompactWeather
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CompactWeatherWidgets:
    type: app-extension
    platform: watchOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: CmpctWthr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: Your location is used to show local weather (rounded to about 1 km and sent to open-meteo.com).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CompactWeather.widgets
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
